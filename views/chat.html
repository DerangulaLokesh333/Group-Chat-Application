<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: white;
        }

        h2 {
            text-align: center;
            margin: 10px 0;
        }

        #chatContainer {
            width: 70%;
            height: 80vh;
            margin: 20px auto;
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
        }

        #userList {
            padding: 10px 20px;
            background-color: #f1f1f1;
            border-bottom: 1px solid #ccc;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        #messageForm {
            display: flex;
            padding: 10px;
            background-color: #24536b;
        }

        #messageInput {
            flex: 1;
            padding: 8px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Chat App</h2>

    <div id="chatContainer">
        <div id="userList">
            <strong>Logged-in Users:</strong>
            <ul id="users"></ul>
        </div>

        <div id="messages">
            <p>Welcome to the chat!</p>
        </div>

        <form id="messageForm">
            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                autocomplete="off"
                required
            >
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="/chat.js"></script>
</body>
</html>
